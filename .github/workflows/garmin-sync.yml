name: Sync Garmin health data

# Refreshes data/health.json so the .FUN dashboard stays current.
# Requires two repository secrets: GARMIN_EMAIL and GARMIN_PASSWORD
# (Settings -> Secrets and variables -> Actions -> New repository secret).

on:
  schedule:
    - cron: '15 11 * * *'   # 11:15 UTC daily (~7:15am ET)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect

      - name: Fetch Garmin data
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/fetch_garmin.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/health.json
          git diff --staged --quiet || git commit -m "chore: refresh Garmin health data"
          git push
